<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ralf MediaPipe Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #eee;
      font-family: 'SF Mono', monospace;
      font-size: 14px;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
    }
    canvas {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(0,0,0,0.75);
      padding: 10px 16px;
      border-radius: 6px;
      z-index: 10;
      line-height: 1.6;
    }
    #hud .ok { color: #0f0; }
    #hud .err { color: #f55; }
    #hud .dim { color: #888; }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="hud">
    <div>MediaPipe: <span id="mp-status" class="dim">loading...</span></div>
    <div>WebSocket: <span id="ws-status" class="dim">connecting...</span></div>
    <div>FPS: <span id="fps" class="dim">--</span></div>
  </div>

  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    const CONNECTIONS = [
      [11, 12], [11, 23], [12, 24], [23, 24],
      [11, 13], [13, 15], [15, 17], [15, 19], [15, 21],
      [12, 14], [14, 16], [16, 18], [16, 20], [16, 22],
      [23, 25], [25, 27], [27, 29], [27, 31],
      [24, 26], [26, 28], [28, 30], [28, 32],
    ];

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const mpStatus = document.getElementById("mp-status");
    const wsStatus = document.getElementById("ws-status");
    const fpsEl = document.getElementById("fps");

    // --- WebSocket ---
    let ws = null;
    function connectWs() {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onopen = () => {
        wsStatus.textContent = "connected";
        wsStatus.className = "ok";
      };
      ws.onclose = () => {
        wsStatus.textContent = "disconnected";
        wsStatus.className = "err";
        setTimeout(connectWs, 2000);
      };
      ws.onerror = () => {};
    }
    connectWs();

    function sendPose(landmarks) {
      if (ws && ws.readyState === 1 && ws.bufferedAmount < 16384) {
        ws.send(JSON.stringify({ landmarks }));
      }
    }

    // --- MediaPipe ---
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    const poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numPoses: 1,
      minPoseDetectionConfidence: 0.65,
      minPosePresenceConfidence: 0.65,
      minTrackingConfidence: 0.5,
    });

    mpStatus.textContent = "ready";
    mpStatus.className = "ok";

    // --- Camera ---
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720, facingMode: "user" },
      audio: false,
    });
    video.srcObject = stream;
    await new Promise(r => { video.onloadedmetadata = r; });
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // --- Detection loop ---
    let frames = 0;
    let lastFpsTime = Date.now();
    let lastTimestamp = -1;

    function detect() {
      const now = performance.now();

      // Timestamp guard: MediaPipe requires strictly increasing timestamps
      if (now <= lastTimestamp) {
        requestAnimationFrame(detect);
        return;
      }
      lastTimestamp = now;

      const results = poseLandmarker.detectForVideo(video, now);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.landmarks && results.landmarks.length > 0) {
        const lm = results.landmarks[0];
        drawSkeleton(lm);
        sendPose(lm);
        frames++;
      }

      // FPS counter
      const elapsed = Date.now() - lastFpsTime;
      if (elapsed >= 1000) {
        fpsEl.textContent = frames;
        fpsEl.className = frames > 15 ? "ok" : "err";
        frames = 0;
        lastFpsTime = Date.now();
      }

      requestAnimationFrame(detect);
    }

    function drawSkeleton(landmarks) {
      ctx.strokeStyle = "#00d4ff";
      ctx.lineWidth = 3;
      ctx.lineCap = "round";

      for (const [i, j] of CONNECTIONS) {
        const a = landmarks[i], b = landmarks[j];
        if (a.visibility > 0.5 && b.visibility > 0.5) {
          ctx.beginPath();
          ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
          ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
          ctx.stroke();
        }
      }

      for (const lm of landmarks) {
        if (lm.visibility > 0.5) {
          ctx.fillStyle = "#ff6b6b";
          ctx.beginPath();
          ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    detect();
  </script>
</body>
</html>
