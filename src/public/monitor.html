<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ralf-mocap MediaPipe Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 14px;
      padding: 20px;
    }
    h1 {
      color: #0ff;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: normal;
    }
    .container {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 20px;
      max-width: 1400px;
    }
    .panel {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 16px;
    }
    .panel h2 {
      color: #0ff;
      font-size: 14px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #0f3460;
    }
    .status-grid {
      display: grid;
      gap: 8px;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      background: #1a1a2e;
      border-radius: 4px;
    }
    .status-label { color: #888; }
    .status-value { color: #0f0; font-weight: bold; }
    .status-value.disconnected { color: #f55; }
    .skeleton-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }
    #skeleton-canvas {
      background: #1a1a2e;
      border-radius: 4px;
    }
    .keypoints-scroll {
      max-height: 400px;
      overflow-y: auto;
    }
    .keypoints-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .keypoints-table th, .keypoints-table td {
      padding: 4px 6px;
      text-align: right;
      border-bottom: 1px solid #0f3460;
    }
    .keypoints-table th {
      color: #888;
      font-weight: normal;
      text-align: left;
      position: sticky;
      top: 0;
      background: #16213e;
    }
    .keypoints-table td:first-child {
      text-align: left;
      color: #0ff;
    }
    .footer {
      margin-top: 20px;
      color: #666;
      font-size: 12px;
    }
    .footer a { color: #0ff; text-decoration: none; }
  </style>
</head>
<body>
  <h1>ralf-mocap MediaPipe Monitor</h1>

  <div class="container">
    <div class="left-column">
      <div class="panel" style="margin-bottom: 20px;">
        <h2>Status</h2>
        <div class="status-grid">
          <div class="status-item">
            <span class="status-label">Connection</span>
            <span class="status-value" id="connection-status">Connecting...</span>
          </div>
          <div class="status-item">
            <span class="status-label">OSC Port</span>
            <span class="status-value" id="osc-port">--</span>
          </div>
          <div class="status-item">
            <span class="status-label">Messages</span>
            <span class="status-value" id="message-count">0</span>
          </div>
          <div class="status-item">
            <span class="status-label">Rate</span>
            <span class="status-value" id="message-rate">0 msg/s</span>
          </div>
          <div class="status-item">
            <span class="status-label">Keypoints</span>
            <span class="status-value" id="keypoint-count">33</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>Skeleton</h2>
        <div class="skeleton-container">
          <canvas id="skeleton-canvas" width="300" height="400"></canvas>
        </div>
      </div>
    </div>

    <div class="right-column">
      <div class="panel">
        <h2>Landmarks (33)</h2>
        <div class="keypoints-scroll">
          <table class="keypoints-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>X</th>
                <th>Y</th>
                <th>Z</th>
                <th>Vis</th>
              </tr>
            </thead>
            <tbody id="keypoints-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="/">Back to capture</a> | MediaPipe Pose Lite (33 landmarks, 3D)
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // MediaPipe landmark names
    const LANDMARK_NAMES = [
      'nose', 'left_eye_inner', 'left_eye', 'left_eye_outer',
      'right_eye_inner', 'right_eye', 'right_eye_outer',
      'left_ear', 'right_ear', 'mouth_left', 'mouth_right',
      'left_shoulder', 'right_shoulder', 'left_elbow', 'right_elbow',
      'left_wrist', 'right_wrist', 'left_pinky', 'left_index', 'left_thumb',
      'right_pinky', 'right_index', 'right_thumb',
      'left_hip', 'right_hip', 'left_knee', 'right_knee',
      'left_ankle', 'right_ankle', 'left_heel', 'right_heel',
      'left_foot_index', 'right_foot_index'
    ];

    const SKELETON_EDGES = [
      [11, 12], [11, 23], [12, 24], [23, 24],  // Torso
      [11, 13], [13, 15], [15, 17], [15, 19], [15, 21],  // Left arm
      [12, 14], [14, 16], [16, 18], [16, 20], [16, 22],  // Right arm
      [23, 25], [25, 27], [27, 29], [27, 31],  // Left leg
      [24, 26], [26, 28], [28, 30], [28, 32],  // Right leg
    ];

    // DOM elements
    const connectionStatus = document.getElementById('connection-status');
    const oscPortEl = document.getElementById('osc-port');
    const messageCountEl = document.getElementById('message-count');
    const messageRateEl = document.getElementById('message-rate');
    const keypointCountEl = document.getElementById('keypoint-count');
    const keypointsBody = document.getElementById('keypoints-body');
    const canvas = document.getElementById('skeleton-canvas');
    const ctx = canvas.getContext('2d');

    // State
    let messagesInLastSecond = 0;
    let lastUIUpdate = 0;
    const UI_UPDATE_INTERVAL = 66; // ~15fps
    let pendingPose = null;

    // Initialize table
    function initKeypointsTable() {
      keypointsBody.innerHTML = LANDMARK_NAMES.map((name, i) => `
        <tr id="lm-${i}">
          <td>${name}</td>
          <td class="x">--</td>
          <td class="y">--</td>
          <td class="z">--</td>
          <td class="vis">--</td>
        </tr>
      `).join('');
    }

    function updateKeypointsTable(landmarks) {
      landmarks.forEach((lm, i) => {
        const row = document.getElementById(`lm-${i}`);
        if (row) {
          row.querySelector('.x').textContent = lm.x.toFixed(3);
          row.querySelector('.y').textContent = lm.y.toFixed(3);
          row.querySelector('.z').textContent = lm.z.toFixed(3);
          row.querySelector('.vis').textContent = lm.visibility.toFixed(2);
        }
      });
    }

    function drawSkeleton(landmarks) {
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Find bounds
      let minX = 1, maxX = 0, minY = 1, maxY = 0;
      landmarks.forEach(lm => {
        if (lm.visibility > 0.3) {
          minX = Math.min(minX, lm.x);
          maxX = Math.max(maxX, lm.x);
          minY = Math.min(minY, lm.y);
          maxY = Math.max(maxY, lm.y);
        }
      });

      const padding = 30;
      const rangeX = maxX - minX || 0.1;
      const rangeY = maxY - minY || 0.1;
      const scale = Math.min(
        (canvas.width - padding * 2) / rangeX,
        (canvas.height - padding * 2) / rangeY
      );

      const offsetX = (canvas.width - rangeX * scale) / 2 - minX * scale;
      const offsetY = (canvas.height - rangeY * scale) / 2 - minY * scale;

      const mapX = x => x * scale + offsetX;
      const mapY = y => y * scale + offsetY;

      // Draw edges
      ctx.strokeStyle = '#0ff';
      ctx.lineWidth = 2;

      SKELETON_EDGES.forEach(([i, j]) => {
        const lm1 = landmarks[i];
        const lm2 = landmarks[j];
        if (lm1 && lm2 && lm1.visibility > 0.3 && lm2.visibility > 0.3) {
          ctx.beginPath();
          ctx.moveTo(mapX(lm1.x), mapY(lm1.y));
          ctx.lineTo(mapX(lm2.x), mapY(lm2.y));
          ctx.stroke();
        }
      });

      // Draw landmarks
      landmarks.forEach(lm => {
        if (lm.visibility > 0.3) {
          ctx.fillStyle = '#f0f';
          ctx.beginPath();
          ctx.arc(mapX(lm.x), mapY(lm.y), 4, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    // Socket.io
    const socket = io();

    socket.on('connect', () => {
      connectionStatus.textContent = 'Connected';
      connectionStatus.className = 'status-value';
    });

    socket.on('disconnect', () => {
      connectionStatus.textContent = 'Disconnected';
      connectionStatus.className = 'status-value disconnected';
    });

    socket.on('config', (config) => {
      oscPortEl.textContent = config.oscPort;
      keypointCountEl.textContent = config.keypointCount;
    });

    socket.on('pose', (pose) => {
      if (!pose || !pose.landmarks) return;

      messagesInLastSecond++;
      pendingPose = pose;

      // Throttle UI updates
      const now = performance.now();
      if (now - lastUIUpdate >= UI_UPDATE_INTERVAL) {
        lastUIUpdate = now;
        drawSkeleton(pendingPose.landmarks);
        updateKeypointsTable(pendingPose.landmarks);
      }
    });

    socket.on('stats', (stats) => {
      messageCountEl.textContent = stats.messageCount.toLocaleString();
    });

    // Update rate display
    setInterval(() => {
      messageRateEl.textContent = messagesInLastSecond + ' msg/s';
      messagesInLastSecond = 0;
    }, 1000);

    // Initialize
    initKeypointsTable();
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#666';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Waiting for pose data...', canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
