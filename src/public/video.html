<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ralf-mocap MediaPipe - Video Only</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror */
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror to match video */
    }
    #status {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #0ff;
      font-size: 14px;
      border-radius: 4px;
      z-index: 100;
    }
    #status.error { color: #f55; }
    #status.connected { color: #0f0; }
    #stats {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      font-size: 14px;
      border-radius: 4px;
      z-index: 100;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Loading MediaPipe...</div>
  <div id="stats">-- fps</div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/video.js"></script>
</body>
</html>
