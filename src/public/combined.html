<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ralf-mocap MediaPipe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0f;
      color: #eee;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 13px;
      overflow: hidden;
      height: 100vh;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 320px;
      height: 100vh;
      gap: 0;
    }

    /* Left panel - Video */
    .video-panel {
      position: relative;
      background: #000;
      overflow: hidden;
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: scaleX(-1);
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .video-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .overlay-badge {
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      font-size: 12px;
      backdrop-filter: blur(4px);
    }

    #status { color: #0ff; }
    #status.error { color: #ff5555; }
    #status.connected { color: #50fa7b; }

    #fps {
      color: #50fa7b;
      font-variant-numeric: tabular-nums;
    }

    /* Right panel - Monitoring */
    .monitor-panel {
      background: #12121a;
      border-left: 1px solid #1e1e2e;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-section {
      padding: 16px;
      border-bottom: 1px solid #1e1e2e;
    }

    .panel-section:last-child {
      border-bottom: none;
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      color: #888;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    /* Status grid */
    .status-grid {
      display: grid;
      gap: 8px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-label { color: #666; }
    .status-value {
      color: #50fa7b;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .status-value.disconnected { color: #ff5555; }

    /* Skeleton preview */
    .skeleton-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0;
    }

    #skeleton-canvas {
      background: #0a0a0f;
      border-radius: 4px;
    }

    /* Keypoints table */
    .keypoints-scroll {
      flex: 1;
      overflow-y: auto;
      margin-top: 8px;
    }

    .keypoints-scroll::-webkit-scrollbar {
      width: 6px;
    }

    .keypoints-scroll::-webkit-scrollbar-track {
      background: #1e1e2e;
    }

    .keypoints-scroll::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    .keypoints-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .keypoints-table th {
      color: #666;
      font-weight: normal;
      text-align: right;
      padding: 4px 6px;
      position: sticky;
      top: 0;
      background: #12121a;
    }

    .keypoints-table th:first-child { text-align: left; }

    .keypoints-table td {
      padding: 3px 6px;
      text-align: right;
      border-bottom: 1px solid #1a1a24;
      font-variant-numeric: tabular-nums;
    }

    .keypoints-table td:first-child {
      text-align: left;
      color: #0ff;
      font-size: 10px;
    }

    .keypoints-table tr:hover {
      background: #1a1a24;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: 60vh 1fr;
      }

      .monitor-panel {
        border-left: none;
        border-top: 1px solid #1e1e2e;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left: Video with skeleton overlay -->
    <div class="video-panel">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas"></canvas>
      <div class="video-overlay">
        <div class="overlay-badge" id="status">Loading...</div>
        <div class="overlay-badge" id="fps">-- fps</div>
      </div>
    </div>

    <!-- Right: Monitoring panels -->
    <div class="monitor-panel">
      <!-- Status -->
      <div class="panel-section">
        <div class="panel-header">Status</div>
        <div class="status-grid">
          <div class="status-row">
            <span class="status-label">Connection</span>
            <span class="status-value" id="connection-status">Connecting...</span>
          </div>
          <div class="status-row">
            <span class="status-label">OSC Port</span>
            <span class="status-value" id="osc-port">--</span>
          </div>
          <div class="status-row">
            <span class="status-label">Messages</span>
            <span class="status-value" id="message-count">0</span>
          </div>
          <div class="status-row">
            <span class="status-label">Rate</span>
            <span class="status-value" id="message-rate">0 msg/s</span>
          </div>
        </div>
      </div>

      <!-- Skeleton preview -->
      <div class="panel-section">
        <div class="panel-header">Skeleton</div>
        <div class="skeleton-container">
          <canvas id="skeleton-canvas" width="280" height="200"></canvas>
        </div>
      </div>

      <!-- Keypoints table -->
      <div class="panel-section">
        <div class="panel-header">Landmarks (33)</div>
        <div class="keypoints-scroll">
          <table class="keypoints-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>X</th>
                <th>Y</th>
                <th>Z</th>
                <th>Vis</th>
              </tr>
            </thead>
            <tbody id="keypoints-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/combined.js"></script>
</body>
</html>
